  # ============================================================
  # Coze 适配器 - 将 Coze 请求转换为 Hermes API
  # ============================================================
  coze-adapter:
    image: python:3.14-slim
    container_name: coze-adapter
    restart: unless-stopped
    env_file:
      - ./config/.env
    ports:
      - "8081:8081"                          # Coze 调用的入口
    volumes:
      - ./scripts/coze-adapter.py:/app/main.py:ro
    environment:
      - HERMES_API_URL=http://hermes:8642
      - API_SERVER_KEY=${API_SERVER_KEY:-sk-yxYy2y6sbaV6GNnFfMOhacaegNk1VjD052F9TFtFolV2Fo0V}

    command: >
      bash -c "
        pip install fastapi uvicorn httpx &&
        python /app/main.py
      "
    networks:
      - rag-network
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  nginx-obsidian:
    image: nginx:1.29.2-alpine3.22-slim
    container_name: nginx-obsidian
    ports:
      - "3001:3001"  # 使用 HTTPS 访问端口 3001
    volumes:
      - ./data/obsidian/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:rw
      - ./data/obsidian/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - rag-network
    depends_on:
      - obsidian
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 1G

  obsidian:
    image: ghcr.io/linuxserver/obsidian:1.13.7
    container_name: obsidian
    security_opt:
      - no-new-privileges:false
      - seccomp:unconfined
    ports:
      - "3000:3000"
    volumes:
      - ./data/obsidian/config:/config          # 配置文件（独立）
      - ./data/obsidian/workspace:/workspace    # 工作空间（独立）
      - hermes_obsidian_volume:/knowledge_base/obsidian  # 笔记数据（共享给 hermes）
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - CUSTOM_USER=${OBSIDIAN_USER:-admin}           # 可选：HTTP 认证用户名
      - PASSWORD=${OBSIDIAN_PASSWORD:-obsidian123}    # 可选：HTTP 认证密码
    shm_size: "2gb"  # 重要：Electron/Chromium 需要共享内存[citation:2]
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  obsidian-sync:
    image: python:3.14-slim
    container_name: obsidian-sync
    restart: unless-stopped
    env_file:
      - ./config/.env
    volumes:
#      - ./data/obsidian/knowledge:/knowledge_base/obsidian:rw
      - hermes_obsidian_volume:/knowledge_base/obsidian:rw
      - ./scripts/syncObsidian2Qdrant.py:/sync.py:ro
    environment:
      - OBSIDIAN_VAULT_PATH=/knowledge_base/obsidian
      - HERMES_API_URL=http://hermes:8642
      - API_SERVER_KEY=${API_SERVER_KEY:-sk-yxYy2y6sbaV6GNnFfMOhacaegNk1VjD052F9TFtFolV2Fo0V}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1  # 实时输出日志
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    command: >
      bash -c "
        pip install watchdog requests &&
        python /sync.py
      "
    networks:
      - rag-network
    depends_on:
      - hermes
      - obsidian
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

