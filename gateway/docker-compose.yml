# docker-compose.yml
services:

  # ============================================================
  # Dify - AI 应用开发平台
  # ============================================================

  # ---------- 支撑组件 ----------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD:-dify123456}
      POSTGRES_DB: ${DIFY_DB_DATABASE:-dify}
      POSTGRES_USER: ${DIFY_DB_USERNAME:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIFY_DB_USERNAME:-postgres} -d ${DIFY_DB_DATABASE:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7.4.0-alpine3.20
    container_name: redis
    restart: unless-stopped
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    volumes:
      - ./data/redis/data:/redis/data
      - ./data/redis/config:/redis/config
      - ./data/redis/data:/data   # 覆盖镜像 VOLUME /data
    ports:
      - "6379:6379"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  sandbox:
    image: langgenius/dify-sandbox:main
    container_name: sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      - ./data/sandbox:/dependencies
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ssrf_proxy:
    image: ubuntu/squid:latest
    container_name: ssrf_proxy
    restart: unless-stopped
    volumes:
      - ./data/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./data/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
      - ./data/ssrf_proxy/log:/var/log/squid     # 覆盖镜像 VOLUME /var/log/squid
      - ./data/ssrf_proxy/spool:/var/spool/squid # 覆盖镜像 VOLUME /var/spool/squid
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    ports:
      - "3128:3128"
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  dify-api:
    image: langgenius/dify-api:1.16.1  # 使用具体版本号
    container_name: dify-api
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - dify_storage_volume:/app/api/storage
    environment:
      # 核心数据库配置 - 指向你的外部 PostgreSQL
      DB_USERNAME: ${DIFY_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify123456}
      DB_HOST: ${DIFY_DB_HOST:-postgres}
      DB_PORT: ${DIFY_DB_PORT:-5432}
      DB_DATABASE: ${DIFY_DB_DATABASE:-dify}
      # Redis 配置 - 建议新增一个独立的 Redis 服务，或复用现有
      REDIS_HOST: ${DIFY_REDIS_HOST:-redis}
      REDIS_PORT: ${DIFY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-dify123456}
      REDIS_DB: ${DIFY_REDIS_DB:-0}
      # Celery 消息队列
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-dify123456}@${DIFY_REDIS_HOST:-redis}:${DIFY_REDIS_PORT:-6379}/1
      # 向量数据库 - 指向你现有的 Qdrant
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dify123456}
      # Embedding 服务 - 指向你现有的 embedding-llama
      EMBEDDING_PROVIDER: openai  # 使用 OpenAI 兼容接口
      OPENAI_API_BASE: http://embedding-llama:8000/v1
      OPENAI_API_KEY: dummy  # llama.cpp 不需要真实 Key
      # 沙箱和安全
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      # Dify 核心配置
      SECRET_KEY: ${DIFY_SECRET_KEY:-dify123456}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost:8083}
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost:8082}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost:8082}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:8083}
      APP_API_URL: ${APP_API_URL:-http://localhost:8082}
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://dify-plugin_daemon:5002}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-sk-yxYy2y6sbaV6GNnFfMOhacaegNk1VjD052F9TFtFolV2Fo0V}
      MODE: api
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    ports:
      - "8082:5001"  # 暴露 API 端口
    networks:
      - rag-network
    depends_on:
      - qdrant
      - embedding-llama
      - postgres
      - redis
      - sandbox
      - ssrf_proxy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  dify-worker:
    image: langgenius/dify-api:1.16.1
    container_name: dify-worker
    restart: unless-stopped
    command: /bin/bash /entrypoint.sh worker
    env_file:
      - ./.env
    volumes:
      - dify_storage_volume:/app/api/storage
    environment:
      # 与 dify-api 保持完全相同的环境变量
      DB_USERNAME: ${DIFY_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify123456}
      DB_HOST: ${DIFY_DB_HOST:-postgres}
      DB_PORT: ${DIFY_DB_PORT:-5432}
      DB_DATABASE: ${DIFY_DB_DATABASE:-dify}
      REDIS_HOST: ${DIFY_REDIS_HOST:-redis}
      REDIS_PORT: ${DIFY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-dify123456}
      REDIS_DB: ${DIFY_REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-dify123456}@${DIFY_REDIS_HOST:-redis}:${DIFY_REDIS_PORT:-6379}/1
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dify123456}
      EMBEDDING_PROVIDER: openai
      OPENAI_API_BASE: http://embedding-llama:8000/v1
      OPENAI_API_KEY: dummy
      # 沙箱和安全
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      SECRET_KEY: ${DIFY_SECRET_KEY:-dify123456}
      MODE: worker
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    networks:
      - rag-network
    depends_on:
      - qdrant
      - embedding-llama
      - dify-api
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  dify-web:
    image: langgenius/dify-web:1.16.1
    container_name: dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://192.168.137.10:8082}
      APP_API_URL: ${APP_API_URL:-http://192.168.137.10:8082}
    ports:
      - "8083:3000"  # 暴露 Web 界面端口
    networks:
      - rag-network
    depends_on:
      - dify-api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M


  dify-worker_beat:
    image: langgenius/dify-api:1.16.1
    container_name: dify-worker_beat
    restart: unless-stopped
    command: /bin/bash /entrypoint.sh beat
    env_file:
      - ./.env
    environment:
      DB_USERNAME: ${DIFY_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify123456}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB_DATABASE:-dify}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-dify123456}
      REDIS_USE_SSL: "false"
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-dify123456}@redis:6379/1
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-}
      MODE: beat
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

  dify-plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: dify-plugin_daemon
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_HOST: ${DIFY_DB_HOST:-postgres}
      DB_PORT: ${DIFY_DB_PORT:-5432}
      DB_USERNAME: ${DIFY_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-dify123456}
      SERVER_PORT: 5002
      SERVER_HOST: 0.0.0.0
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-plugin-daemon-key}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PPROF_ENABLED: ${PLUGIN_PPROF_ENABLED:-false}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DAEMON_KEY:-plugin-daemon-key}
      DIFY_API_URL: http://dify-api:5001
      DIFY_API_KEY: ${PLUGIN_DAEMON_KEY:-plugin-daemon-key}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STDIO_BUFFER_SIZE: ${PLUGIN_STDIO_BUFFER_SIZE:-1024}
      PLUGIN_STDIO_MAX_BUFFER_SIZE: ${PLUGIN_STDIO_MAX_BUFFER_SIZE:-5242880}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_INSTALLED_PATH: ${PLUGIN_INSTALLED_PATH:-plugin}
      PLUGIN_PACKAGE_CACHE_PATH: ${PLUGIN_PACKAGE_CACHE_PATH:-plugin_packages}
      PLUGIN_MEDIA_CACHE_PATH: ${PLUGIN_MEDIA_CACHE_PATH:-assets}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-dify123456}
      REDIS_DB: 0
      TZ: Asia/Shanghai
    ports:
      - "5002:5002"
      - "5003:5003"
    volumes:
      - ./data/plugin_daemon:/app/storage
    networks:
      - rag-network
    depends_on:
      - dify-api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G


